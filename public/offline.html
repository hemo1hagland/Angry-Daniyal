    <main class="page"><div class="box"><div class="mark">V</div><h1>Du er frakoblet</h1><p>Spill du allerede har åpnet virker fortsatt. Koble til nettet én gang for å hente resten.</p><button onclick="location.reload()">Prøv igjen</button></div></main>
